<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Money Terminal — Study With Us</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">

    <!-- Lightweight Charts for Chapter 3 -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        /* Study Layout */
        body {
            overflow: hidden;
            /* Prevent body scroll, let sidebar and content scroll independently */
        }

        .study-container {
            display: flex;
            height: calc(100vh - 70px);
            /* Subtract header height */
            background: var(--bg);
        }

        /* Sidebar Styles */
        .study-sidebar {
            width: 320px;
            min-width: 320px;
            background: var(--surface-1);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--surface-1);
            z-index: 10;
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 1.3rem;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .chapter-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .chapter-item {
            border-bottom: 1px solid var(--border);
        }

        .chapter-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            color: var(--text);
            text-decoration: none;
            transition: background 0.2s;
            cursor: pointer;
        }

        .chapter-link:hover {
            background: var(--surface-2);
        }

        .chapter-link.active {
            background: rgba(0, 210, 255, 0.1);
            border-left: 3px solid var(--accent);
        }

        .chapter-title {
            font-weight: 500;
            font-size: 0.95rem;
        }

        .chapter-status {
            font-size: 1.2rem;
            margin-left: 0.5rem;
        }

        /* Main Content Styles */
        .study-content {
            flex-grow: 1;
            overflow-y: auto;
            padding: 3rem 4rem;
            background: var(--bg);
            scroll-behavior: smooth;
        }

        .lesson-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .lesson-header {
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .lesson-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .lesson-body {
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--text-muted);
        }

        .lesson-body h2 {
            color: var(--text);
            font-size: 1.6rem;
            margin: 2.5rem 0 1rem;
        }

        .lesson-body h3 {
            color: var(--text);
            font-size: 1.3rem;
            margin: 2rem 0 1rem;
        }

        .lesson-body blockquote {
            border-left: 4px solid var(--accent);
            margin: 1.5rem 0;
            padding: 1rem 1.5rem;
            background: var(--surface-2);
            border-radius: 0 8px 8px 0;
        }

        .lesson-body pre {
            background: var(--surface-2);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--text);
            margin: 1.5rem 0;
        }

        .lesson-body code {
            font-family: 'JetBrains Mono', monospace;
            background: var(--surface-2);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .lesson-body ul,
        .lesson-body ol {
            margin: 1.5rem 0;
            padding-left: 1.5rem;
        }

        .lesson-body li {
            margin-bottom: 0.5rem;
        }

        /* Real Example / Highlight Boxes */
        .real-example {
            background: rgba(255, 153, 0, 0.1);
            border: 1px solid rgba(255, 153, 0, 0.3);
            border-radius: 8px;
            padding: 1.5rem;
            margin: 2rem 0;
        }

        .real-example-title {
            color: #ff9900;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Live Widget Containers */
        .live-widget {
            background: var(--surface-1);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            margin: 2.5rem 0;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .live-widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }

        .live-widget-title {
            font-weight: 600;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Progress / Quiz Section */
        .quiz-section {
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 2px dashed var(--border);
        }

        .quiz-question {
            margin-bottom: 1.5rem;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .quiz-option {
            background: var(--surface-2);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .quiz-option:hover {
            background: var(--surface-3);
        }

        .quiz-option.selected {
            border-color: var(--accent);
            background: rgba(0, 210, 255, 0.1);
        }

        .quiz-option.correct {
            border-color: #00e676;
            background: rgba(0, 230, 118, 0.1);
            color: #00e676;
        }

        .quiz-option.wrong {
            border-color: #ff3d00;
            background: rgba(255, 61, 0, 0.1);
            color: #ff3d00;
        }

        .quiz-submit {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: opacity 0.2s;
        }

        .quiz-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .navigation-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            padding-bottom: 4rem;
        }

        .nav-btn {
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.2s;
        }

        .nav-btn-prev {
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .nav-btn-prev:hover {
            background: var(--surface-2);
            color: var(--text);
        }

        .nav-btn-next {
            background: var(--surface-2);
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .nav-btn-next:hover {
            background: rgba(0, 210, 255, 0.1);
        }

        .nav-btn-next.locked {
            opacity: 0.5;
            pointer-events: none;
            border-color: var(--border);
            color: var(--text-muted);
        }

        /* Mobile Toggle */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
            margin-right: 1rem;
        }

        @media (max-width: 900px) {
            .mobile-menu-btn {
                display: block;
            }

            .study-sidebar {
                position: fixed;
                left: 0;
                top: 70px;
                /* Below header */
                height: calc(100vh - 70px);
                transform: translateX(-100%);
                z-index: 100;
            }

            .study-sidebar.open {
                transform: translateX(0);
            }

            .study-content {
                padding: 1.5rem;
            }
        }

        /* Tables in lesson */
        .lesson-table {
            width: 100%;
            border-collapse: collapse;
            margin: 2rem 0;
            font-size: 0.95rem;
        }

        .lesson-table th,
        .lesson-table td {
            padding: 1rem;
            border: 1px solid var(--border);
            text-align: left;
        }

        .lesson-table th {
            background: var(--surface-2);
            color: var(--text);
            font-weight: 600;
        }

        .action-link-btn {
            display: inline-block;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            margin-top: 1rem;
        }

        /* Live Quote Widget Specific styles */
        .q-widget-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1rem;
        }

        .q-widget-box {
            background: var(--surface-2);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .q-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .q-val {
            font-size: 1.2rem;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        /* ═══ NEW: Part Section Dividers in Sidebar ═══ */
        .part-divider {
            padding: 0.75rem 1.5rem;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent, #00d2ff);
            background: linear-gradient(90deg, rgba(0, 210, 255, 0.08), transparent);
            border-top: 1px solid rgba(0, 210, 255, 0.15);
            border-bottom: 1px solid rgba(0, 210, 255, 0.08);
            margin-top: 0.25rem;
        }

        /* ═══ NEW: Institutional Insight Box ═══ */
        .wall-street-box {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.08), rgba(30, 64, 175, 0.04));
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-left: 4px solid #3b82f6;
            border-radius: 8px;
            padding: 1.5rem;
            margin: 2rem 0;
        }

        .wall-street-box-title {
            color: #60a5fa;
            font-weight: 700;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
        }

        .wall-street-box p,
        .wall-street-box ul {
            color: var(--text-muted);
            margin: 0.5rem 0;
        }

        /* ═══ NEW: Case Study Box ═══ */
        .case-study-box {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.08), rgba(88, 28, 135, 0.04));
            border: 1px solid rgba(139, 92, 246, 0.25);
            border-left: 4px solid #8b5cf6;
            border-radius: 8px;
            padding: 1.5rem;
            margin: 2rem 0;
        }

        .case-study-box-title {
            color: #a78bfa;
            font-weight: 700;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
        }

        .case-study-box p,
        .case-study-box ul {
            color: var(--text-muted);
            margin: 0.5rem 0;
        }

        /* ═══ NEW: Key Formula Box ═══ */
        .formula-box {
            background: rgba(16, 185, 129, 0.06);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-left: 4px solid #10b981;
            border-radius: 8px;
            padding: 1.25rem 1.5rem;
            margin: 1.5rem 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            color: #34d399;
        }

        /* ═══ NEW: Warning / Danger Box ═══ */
        .danger-box {
            background: rgba(239, 68, 68, 0.06);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-left: 4px solid #ef4444;
            border-radius: 8px;
            padding: 1.25rem 1.5rem;
            margin: 1.5rem 0;
        }

        .danger-box-title {
            color: #f87171;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* ═══ NEW: Progress Bar ═══ */
        .academy-progress {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1.5rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .academy-progress-bar {
            flex: 1;
            height: 4px;
            background: var(--surface-2);
            border-radius: 4px;
            overflow: hidden;
        }

        .academy-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .academy-progress-text {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            color: var(--accent);
        }
    </style>
</head>

<body>

    <!-- ═══ HEADER ═══ -->
    <header class="header">
        <div class="header-left">
            <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
            <a href="/" style="text-decoration:none;">
                <h1 class="logo">SMART<span class="logo-accent">MONEY</span></h1>
            </a>
            <span class="logo-sub">Institutional Intelligence Terminal</span>
        </div>
        <div class="header-right">
            <a href="/" class="nav-btn-prev" style="text-decoration: none;">← Back to Terminal</a>
        </div>
    </header>

    <div class="study-container">
        <!-- SIDEBAR -->
        <aside class="study-sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>📚 Chapters</h2>
            </div>
            <div class="academy-progress" id="progress-bar">
                <span>Progress</span>
                <div class="academy-progress-bar">
                    <div class="academy-progress-fill" id="progress-fill" style="width:0%"></div>
                </div>
                <span class="academy-progress-text" id="progress-text">0%</span>
            </div>
            <ul class="chapter-list" id="chapter-list">
                <!-- Populated by JS -->
            </ul>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="study-content" id="main-content">
            <div class="lesson-container">
                <div class="lesson-header">
                    <div style="color:var(--accent); font-weight:600; margin-bottom:0.5rem" id="lesson-chapter-label">
                        Chapter 1</div>
                    <h1 id="lesson-title">Loading...</h1>
                </div>

                <div class="lesson-body" id="lesson-body-content">
                    <!-- Markdown/HTML Content Goes Here -->
                </div>

                <div class="quiz-section" id="quiz-section" style="display:none">
                    <h3>Knowledge Check</h3>
                    <p style="color:var(--text-muted); margin-bottom: 2rem;">Answer correctly to unlock the next
                        chapter.</p>
                    <div id="quiz-container">
                        <!-- Questions injected here -->
                    </div>
                    <button class="quiz-submit" id="quiz-submit-btn" onclick="submitQuiz()">Submit Answers</button>
                    <div id="quiz-feedback" style="margin-top: 1rem; font-weight: 600;"></div>
                </div>

                <div class="navigation-footer">
                    <a href="#" class="nav-btn nav-btn-prev" id="btn-prev"
                        onclick="navigateChapter(-1); return false;">← Previous</a>
                    <a href="#" class="nav-btn nav-btn-next" id="btn-next"
                        onclick="navigateChapter(1); return false;">Next Chapter →</a>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/learn_data.js"></script>
    <script>
        // App State
        let currentChapterIdx = 0;
        let completedChapters = JSON.parse(localStorage.getItem("smartmoney_completed_chapters") || "[]");
        let userAnswers = {};

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // Initialize App
        function initApp() {
            // Check URL hash for routing
            const hash = window.location.hash;
            if (hash && hash.startsWith('#chapter-')) {
                const targetId = parseInt(hash.replace('#chapter-', ''));
                const idx = chaptersData.findIndex(c => c.id === targetId);
                if (idx !== -1) currentChapterIdx = idx;
            }

            renderSidebar();
            renderChapter();
        }

        // Part labels map (chapter id → part label)
        const partLabels = {
            1: '🏗️ Part I — Foundations',
            5: '📊 Part II — Analysis',
            10: '🏦 Part III — Institutional Intelligence',
            14: '💰 Part IV — Portfolio Management',
            18: '🔬 Part V — Advanced Strategies'
        };

        function renderSidebar() {
            const list = document.getElementById('chapter-list');
            list.innerHTML = '';

            // Update progress bar
            const pct = Math.round((completedChapters.length / chaptersData.length) * 100);
            document.getElementById('progress-fill').style.width = pct + '%';
            document.getElementById('progress-text').textContent = pct + '%';

            chaptersData.forEach((chapter, index) => {
                const isCompleted = completedChapters.includes(chapter.id);
                const isActive = index === currentChapterIdx;

                // Insert Part divider if this chapter starts a new part
                if (partLabels[chapter.id]) {
                    const divider = document.createElement('li');
                    divider.className = 'part-divider';
                    divider.textContent = partLabels[chapter.id];
                    list.appendChild(divider);
                }

                // Determine if locked (must complete previous, except 1st)
                let isLocked = false;
                if (index > 0 && !completedChapters.includes(chaptersData[index - 1].id)) {
                    // For dev/demo allow free navigation, but usually: isLocked = true;
                }

                const li = document.createElement('li');
                li.className = 'chapter-item';

                li.innerHTML = `
                    <a class="chapter-link ${isActive ? 'active' : ''}" onclick="goToChapter(${index})" style="${isLocked ? 'opacity:0.5; cursor:not-allowed' : ''}">
                        <span class="chapter-title">Ch ${chapter.id}: ${chapter.title}</span>
                        <span class="chapter-status">${isCompleted ? '✅' : (isLocked ? '🔒' : '')}</span>
                    </a>
                `;
                list.appendChild(li);
            });
        }

        function goToChapter(index) {
            // Optional: Check lock status
            if (index > 0 && !completedChapters.includes(chaptersData[index - 1].id)) {
                // alert("Please complete the previous chapter's quiz first!");
                // return; // Removed for demo flexibility
            }

            currentChapterIdx = index;
            window.location.hash = `chapter-${chaptersData[index].id}`;
            renderSidebar();
            renderChapter();

            // On mobile, close sidebar after tap
            document.getElementById('sidebar').classList.remove('open');
        }

        function navigateChapter(direction) {
            const newIdx = currentChapterIdx + direction;
            if (newIdx >= 0 && newIdx < chaptersData.length) {
                goToChapter(newIdx);
            }
        }

        function renderChapter() {
            const chapter = chaptersData[currentChapterIdx];

            document.getElementById('lesson-chapter-label').innerText = `Chapter ${chapter.id}`;
            document.getElementById('lesson-title').innerText = chapter.title;

            // Reset main content container to top
            document.getElementById('main-content').scrollTop = 0;

            // Render HTML content
            const contentEl = document.getElementById('lesson-body-content');
            contentEl.innerHTML = chapter.content;

            // Inject Live Widgets (if any match the Chapter ID)
            injectLiveWidgets(chapter.id, contentEl);

            // Setup Navigation Buttons
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');

            btnPrev.style.display = currentChapterIdx === 0 ? 'none' : 'inline-flex';

            if (currentChapterIdx === chaptersData.length - 1) {
                btnNext.style.display = 'none';
            } else {
                btnNext.style.display = 'inline-flex';
                // Lock next button if current chapter not completed
                const isCompleted = completedChapters.includes(chapter.id);
                if (!isCompleted && chapter.quiz && chapter.quiz.length > 0) {
                    btnNext.classList.add('locked');
                    btnNext.innerHTML = 'Complete Quiz to Unlock 🔒';
                } else {
                    btnNext.classList.remove('locked');
                    btnNext.innerHTML = 'Next Chapter →';
                }
            }

            // Setup Quiz
            renderQuiz(chapter);
        }

        // ---------- QUIZ SYSTEM ----------
        function renderQuiz(chapter) {
            const section = document.getElementById('quiz-section');
            const container = document.getElementById('quiz-container');
            const feedback = document.getElementById('quiz-feedback');
            const btn = document.getElementById('quiz-submit-btn');

            feedback.innerHTML = '';
            userAnswers = {}; // reset

            if (!chapter.quiz || chapter.quiz.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            container.innerHTML = '';

            const isCompleted = completedChapters.includes(chapter.id);

            chapter.quiz.forEach((q, qIndex) => {
                const qDiv = document.createElement('div');
                qDiv.className = 'quiz-question';

                let html = `<div style="font-weight:600; color:var(--text)">${qIndex + 1}. ${q.question}</div>`;
                html += `<div class="quiz-options">`;

                q.options.forEach((opt, optIndex) => {
                    html += `
                        <div class="quiz-option" id="opt-${qIndex}-${optIndex}" onclick="selectOption(${qIndex}, ${optIndex})">
                            <div style="width:20px;height:20px;border-radius:50%;border:2px solid var(--text-muted);display:flex;align-items:center;justify-content:center;"></div>
                            ${opt}
                        </div>
                    `;
                });

                html += `</div>`;
                qDiv.innerHTML = html;
                container.appendChild(qDiv);
            });

            if (isCompleted) {
                btn.style.display = 'none';
                feedback.innerHTML = '<span style="color:#00e676">✅ You have already completed this chapter!</span>';
            } else {
                btn.style.display = 'block';
                btn.disabled = false;
            }
        }

        function selectOption(qIndex, optIndex) {
            // Disallow changing if already passed
            const chapter = chaptersData[currentChapterIdx];
            if (completedChapters.includes(chapter.id)) return;

            userAnswers[qIndex] = optIndex;

            // Reset UI for this question
            for (let i = 0; i < chapter.quiz[qIndex].options.length; i++) {
                const el = document.getElementById(`opt-${qIndex}-${i}`);
                if (el) {
                    el.classList.remove('selected');
                    // Fill inner circle for selected
                    const circle = el.children[0];
                    circle.innerHTML = '';
                    circle.style.borderColor = 'var(--text-muted)';
                }
            }

            // Set active
            const el = document.getElementById(`opt-${qIndex}-${optIndex}`);
            el.classList.add('selected');
            const circle = el.children[0];
            circle.style.borderColor = 'var(--accent)';
            circle.innerHTML = '<div style="width:10px;height:10px;background:var(--accent);border-radius:50%"></div>';
        }

        function submitQuiz() {
            const chapter = chaptersData[currentChapterIdx];
            const feedback = document.getElementById('quiz-feedback');

            if (Object.keys(userAnswers).length < chapter.quiz.length) {
                feedback.innerHTML = '<span style="color:#ff9900">Please answer all questions.</span>';
                return;
            }

            let correctCount = 0;

            chapter.quiz.forEach((q, qIndex) => {
                const userAns = userAnswers[qIndex];
                const isCorrect = userAns === q.correct;

                // Visual feedback
                const el = document.getElementById(`opt-${qIndex}-${userAns}`);
                if (isCorrect) {
                    correctCount++;
                    el.classList.add('correct');
                    el.classList.remove('selected');
                } else {
                    el.classList.add('wrong');
                    el.classList.remove('selected');
                    // Highlight correct answer
                    document.getElementById(`opt-${qIndex}-${q.correct}`).classList.add('correct');
                }
            });

            if (correctCount === chapter.quiz.length) {
                feedback.innerHTML = '<span style="color:#00e676">🎉 Perfect! Chapter completed.</span>';
                document.getElementById('quiz-submit-btn').style.display = 'none';

                // Mark completed
                if (!completedChapters.includes(chapter.id)) {
                    completedChapters.push(chapter.id);
                    localStorage.setItem("smartmoney_completed_chapters", JSON.stringify(completedChapters));
                    renderSidebar();

                    // Unlock next button
                    const btnNext = document.getElementById('btn-next');
                    btnNext.classList.remove('locked');
                    btnNext.innerHTML = 'Next Chapter →';
                }
            } else {
                feedback.innerHTML = `<span style="color:#ff3d00">You got ${correctCount}/${chapter.quiz.length}. Try again!</span>`;
                // Reset answers so they can try again
                userAnswers = {};
                setTimeout(() => renderQuiz(chapter), 2000);
            }
        }

                    </div>
                    <div id="quote-widget-body">Loading live AAPL data...</div>

                    <div style="overflow-x:auto">
                        <table class="lesson-table" style="margin:0">
                            <thead><tr><th>Institution</th><th>Shares</th><th>Value</th><th>QoQ Change</th></tr></thead>
                            <tbody id="13f-widget-body"><tr><td colspan="4">Loading SEC data...</td></tr></tbody>

        function appendWidgetHTML(container, html) {
            // We inject this to the bottom or replace a specific placeholder
            const wrap = document.createElement('div');
            wrap.innerHTML = html;
            container.appendChild(wrap);
        }

        async function fetchLiveQuote(symbol) {
            try {
                const res = await fetch(`/api/quote/${symbol}`);
                const data = await res.json();

                let body = document.getElementById('quote-widget-body');
                if (!body) return;

                if (data.error) {
                    body.innerHTML = `Error: ${data.error}`;
                    return;
                }

                const cColor = data.change >= 0 ? '#00e676' : '#ff3d00';
                const cSign = data.change >= 0 ? '+' : '';

                body.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:1rem; border-bottom:1px solid var(--border); padding-bottom:1rem;">
                    <div>
                        <div style="font-size:1.8rem; font-weight:700;">${data.symbol}</div>
                        <div style="color:var(--text-muted)">${data.name}</div>
                    </div>
                    <div style="text-align:right">
                        <div style="font-size:1.8rem; font-weight:700;">$${data.price.toFixed(2)}</div>
                        <div style="color:${cColor}; font-weight:600;">${cSign}${data.change.toFixed(2)} (${cSign}${data.change_percent.toFixed(2)}%)</div>
                    </div>
                </div>
                
                <div class="q-widget-grid">
                    <div class="q-widget-box">
                        <div class="q-label">P/E Ratio</div>
                        <div class="q-val">${data.pe_ratio ? data.pe_ratio.toFixed(2) : 'N/A'}</div>
                    </div>
                    <div class="q-widget-box">
                        <div class="q-label">EPS</div>
                        <div class="q-val">${data.eps ? '$' + data.eps.toFixed(2) : 'N/A'}</div>
                    </div>
                    <div class="q-widget-box">
                        <div class="q-label">Market Cap</div>
                        <div class="q-val">$${(data.market_cap / 1e9).toFixed(2)}B</div>
                    </div>
                    <div class="q-widget-box">
                        <div class="q-label">Beta</div>
                        <div class="q-val">${data.beta ? data.beta.toFixed(2) : 'N/A'}</div>
                    </div>
                    <div class="q-widget-box">
                        <div class="q-label">Volume</div>
                        <div class="q-val">${data.volume ? (data.volume / 1e6).toFixed(1) + 'M' : 'N/A'}</div>
                    </div>
                    <div class="q-widget-box">
                        <div class="q-label">52W Range</div>
                        <div class="q-val" style="font-size:1.0rem">$${data.year_low} - $${data.year_high}</div>
                    </div>
                </div>
                `;
            } catch (e) {
                console.error(e);
            }
        }

        async function fetch13F(symbol) {
            const body = document.getElementById('13f-widget-body');
            if (!body) return;

            try {
                const res = await fetch(`/api/stock/${symbol}/holders`);
                const data = await res.json();

                if (data.holders && data.holders.length > 0) {
                    const rows = data.holders.slice(0, 5).map(h => {
                        const chg = h.change_percent || 0;
                        const cColor = chg > 0 ? '#00e676' : (chg < 0 ? '#ff3d00' : 'var(--text-muted)');
                        const cSign = chg > 0 ? '+' : '';
                        return `
                         <tr>
                             <td style="font-weight:600">${h.institution}</td>
                             <td>${(h.shares / 1e6).toFixed(2)}M</td>
                             <td>$${(h.value / 1e9).toFixed(2)}B</td>
                             <td style="color:${cColor}; font-weight:600">${cSign}${chg.toFixed(2)}%</td>
                         </tr>
                         `;
                    }).join('');
                    body.innerHTML = rows;
                } else {
                    body.innerHTML = '<tr><td colspan="4">No data found in cache.</td></tr>';
                }

            } catch (e) {
                body.innerHTML = '<tr><td colspan="4">Error loading data.</td></tr>';
            }
        }

        async function initLiveChart() {
            const container = document.getElementById('chart-widget-body');
            if (!container) return;

            const chart = LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: 350,
                layout: { background: { type: 'solid', color: '#161a22' }, textColor: '#d1d4dc' },
                grid: { vertLines: { color: '#2b2b43' }, horzLines: { color: '#2b2b43' } },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                timeScale: { borderColor: '#2b2b43' }
            });

            const series = chart.addCandlestickSeries({
                upColor: '#00e676', downColor: '#ff3d00', borderVisible: false,
                wickUpColor: '#00e676', wickDownColor: '#ff3d00'
            });

            // Fetch generic SPY data
            try {
                const res = await fetch(`/api/stock/SPY/chart?range=1Y`);
                const json = await res.json();
                if (json.data && json.data.length > 0) {
                    const mapped = json.data.map(d => ({
                        time: d.date, open: d.open, high: d.high, low: d.low, close: d.close
                    }));
                    series.setData(mapped);
                    chart.timeScale().fitContent();
                }
            } catch (e) { }

            window.addEventListener('resize', () => {
                if (container) chart.resize(container.clientWidth, 350);
            });
        }

        async function runDeepAnalysis() {
            const input = document.getElementById('deep-analysis-ticker');
            const results = document.getElementById('deep-analysis-results');
            if (!input || !results) return;

            const ticker = input.value.trim().toUpperCase();
            if (!ticker) {
                results.style.display = 'block';
                results.innerHTML = '<span style="color:#ff3d00">Please enter a ticker symbol.</span>';
                return;
            }

            results.style.display = 'block';
            results.innerHTML = '<div style="color:var(--text-muted); text-align:center;">Running institutional sector-baseline algorithms for ' + ticker + '...</div>';

            try {
                const res = await fetch(`/api/analysis/deep/${ticker}`);
                const data = await res.json();

                if (data.error) {
                    results.innerHTML = `<span style="color:#ff3d00">Error: ${data.error}</span>`;
                    return;
                }

                // Colors
                const valColor = data.valuation.status_flag === 'UNDERVALUED' ? '#00e676' : (data.valuation.status_flag === 'OVERVALUED' ? '#ff3d00' : 'var(--text)');
                const insColor = data.insider_activity.signal === 'STRONG_BUY' || data.insider_activity.signal === 'ACCUMULATION' ? '#00e676' : (data.insider_activity.signal === 'DISTRIBUTION' ? '#ff3d00' : 'var(--text)');
                const trnColor = data.technical_trend.direction === 'UPTREND' ? '#00e676' : (data.technical_trend.direction === 'DOWNTREND' ? '#ff3d00' : 'var(--text)');

                let html = `
                    <div style="text-align:left; background:var(--surface-1); padding:1.5rem; border-radius:8px; border:1px solid var(--border);">
                        <h3 style="margin-top:0; border-bottom:1px solid var(--border); padding-bottom:1rem;">Deep Analysis Report: ${data.symbol} (${data.company_name})</h3>
                        <p style="font-size:0.9rem; color:var(--text-muted);">Sector Class: ${data.sector}</p>
                        
                        <div style="margin-top:1.5rem;">
                            <h4 style="color:${valColor}; display:flex; align-items:center; gap:8px;">
                                📊 Valuation Status: ${data.valuation.status_flag}
                            </h4>
                            <p style="font-size:0.9rem;">${data.valuation.thesis}</p>
                            <div class="q-widget-grid" style="margin-top:0.5rem; grid-template-columns: repeat(4, 1fr);">
                                <div class="q-widget-box" style="padding:0.5rem;"><div class="q-label">P/E</div><div class="q-val">${data.valuation.metrics.stock_pe || 'N/A'}</div></div>
                                <div class="q-widget-box" style="padding:0.5rem; background:rgba(0,0,0,0.3);"><div class="q-label">Sect PE</div><div class="q-val">${data.valuation.metrics.sector_median_pe || 'N/A'}</div></div>
                                <div class="q-widget-box" style="padding:0.5rem;"><div class="q-label">ROI</div><div class="q-val">${data.valuation.metrics.stock_roi ? data.valuation.metrics.stock_roi + '%' : 'N/A'}</div></div>
                                <div class="q-widget-box" style="padding:0.5rem; background:rgba(0,0,0,0.3);"><div class="q-label">Sect ROI</div><div class="q-val">${data.valuation.metrics.sector_median_roi}%</div></div>
                            </div>
                        </div>
                        
                        <div style="margin-top:1.5rem; padding-top:1.5rem; border-top:1px dashed var(--border);">
                            <h4 style="color:${insColor}; display:flex; align-items:center; gap:8px;">
                                🕵️ Insider Activity (6M): ${data.insider_activity.signal.replace('_', ' ')}
                            </h4>
                            <p style="font-size:0.9rem;">${data.insider_activity.thesis}</p>
                            <div class="q-widget-grid" style="margin-top:0.5rem; grid-template-columns: repeat(3, 1fr);">
                                <div class="q-widget-box" style="padding:0.5rem;"><div class="q-label">Total Buys</div><div class="q-val">${data.insider_activity.metrics.total_buys >= 1e6 ? (data.insider_activity.metrics.total_buys / 1e6).toFixed(1) + 'M' : (data.insider_activity.metrics.total_buys >= 1e3 ? (data.insider_activity.metrics.total_buys / 1e3).toFixed(1) + 'k' : data.insider_activity.metrics.total_buys)}</div></div>
                                <div class="q-widget-box" style="padding:0.5rem;"><div class="q-label">Total Sells</div><div class="q-val">${data.insider_activity.metrics.total_sales >= 1e6 ? (data.insider_activity.metrics.total_sales / 1e6).toFixed(1) + 'M' : (data.insider_activity.metrics.total_sales >= 1e3 ? (data.insider_activity.metrics.total_sales / 1e3).toFixed(1) + 'k' : data.insider_activity.metrics.total_sales)}</div></div>
                                <div class="q-widget-box" style="padding:0.5rem;"><div class="q-label">Unique Execs Buying</div><div class="q-val">${data.insider_activity.metrics.unique_buyers}</div></div>
                            </div>
                        </div>
                        
                        <div style="margin-top:1.5rem; padding-top:1.5rem; border-top:1px dashed var(--border);">
                            <h4 style="color:${trnColor}; display:flex; align-items:center; gap:8px;">
                                📈 Technical Trend: ${data.technical_trend.direction}
                            </h4>
                            <p style="font-size:0.9rem;">${data.technical_trend.thesis}</p>
                            ${data.technical_trend.signals.length > 0 ? `<p style="font-size:0.8rem; color:var(--accent);">Signals: ${data.technical_trend.signals.join(', ').replace('_', ' ')}</p>` : ''}
                            <div class="q-widget-grid" style="margin-top:0.5rem; grid-template-columns: repeat(3, 1fr);">
                                <div class="q-widget-box" style="padding:0.5rem;"><div class="q-label">Price</div><div class="q-val">$${data.current_price.toFixed(2)}</div></div>
                                <div class="q-widget-box" style="padding:0.5rem;"><div class="q-label">50-Day MA</div><div class="q-val">$${data.technical_trend.metrics.sma_50}</div></div>
                                <div class="q-widget-box" style="padding:0.5rem;"><div class="q-label">200-Day MA</div><div class="q-val">$${data.technical_trend.metrics.sma_200}</div></div>
                            </div>

                results.innerHTML = html;
            } catch (e) {
                results.innerHTML = `<span style="color:#ff3d00">System Error: ${e.message}</span>`;
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
